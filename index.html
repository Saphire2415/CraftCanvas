<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CraftCanvas: The Texture Forge</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-dark: #121212;
            --mc-panel: #4a4a4a;
            --mc-inner: #2c2c2c;
            --mc-border-light: #bcbcbc;
            --mc-border-dark: #555555;
            --mc-text-shadow: 2px 2px 0px #1e1e1e;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Press Start 2P', monospace;
            user-select: none;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: #2c2c2c;
            color: #ffffff;
            overflow: hidden;
            image-rendering: pixelated;
        }

        /* Persistent Background UI Layers - Points directly to repo PNGs */
        #main-workspace {
            flex-grow: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            background-image: url('dirt_background.png'); 
            background-color: #5c3e26; 
            background-repeat: repeat;
            background-size: 64px;
            padding: 10px;
        }

        /* Fixed Top Title Container with Image Detection */
        #app-header-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 45px;
            margin-top: 5px;
            padding: 0 70px;
            text-align: center;
            z-index: 10;
        }

        #app-title-img {
            max-height: 40px;
            max-width: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .title-fallback-text {
            font-size: 11px;
            text-shadow: var(--mc-text-shadow);
            letter-spacing: 0px;
            color: #ffff55;
            line-height: 1.4;
            word-break: break-word;
        }

        /* Scrollable Drawer Container */
        #drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            height: 100%;
            background-image: url('cobblestone_drawer.png'); 
            background-color: #4a4a4a; 
            background-repeat: repeat;
            background-size: 64px;
            border-right: 6px solid #000;
            z-index: 100;
            transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        #drawer.closed {
            transform: translateX(-100%);
        }

        #drawer-header {
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 4px solid #000;
            padding-top: 75px;
        }

        #drawer-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
        }

        #drawer-content::-webkit-scrollbar { width: 12px; }
        #drawer-content::-webkit-scrollbar-track { background: #1a1a1a; border-left: 2px solid #000; }
        #drawer-content::-webkit-scrollbar-thumb { background: #555; border: 2px solid #fff; }

        /* Menu Navigation Anchor Trigger Box */
        .mc-trigger {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 110;
        }

        /* Styled Buttons & Inputs */
        .mc-btn {
            background: #6c6c6c;
            border: 3px solid #000;
            border-top-color: #b2b2b2;
            border-left-color: #b2b2b2;
            color: #e0e0e0;
            padding: 10px 12px;
            font-size: 10px;
            text-transform: uppercase;
            cursor: pointer;
            text-shadow: var(--mc-text-shadow);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .mc-btn:active {
            border-top-color: #000;
            border-left-color: #000;
            border-bottom-color: #b2b2b2;
            border-right-color: #b2b2b2;
            background: #4a4a4a;
        }

        .mc-input {
            width: 100%;
            background: #121212;
            border: 3px solid #555;
            color: #fff;
            padding: 10px;
            font-size: 10px;
            margin-bottom: 12px;
        }
        .mc-input:focus { border-color: #fff; outline: none; }

        /* Texture Selection Cards */
        .texture-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 10px;
        }

        .texture-card {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #000;
            padding: 6px;
            text-align: center;
            cursor: pointer;
        }
        .texture-card:hover { border-color: #fff; }
        .texture-card.active { border-color: #55ff55; background: rgba(85,255,85,0.1); }

        .texture-card img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            image-rendering: pixelated;
            border: 2px solid #222;
            background: #333;
        }

        .texture-card span {
            display: block;
            font-size: 7px;
            margin-top: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Editing Canvas Container */
        #canvas-frame {
            flex-grow: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            padding: 10px;
        }

        /* Rigid Sizing Rules — Prevents Canvas shrinking while remaining responsive */
        #editor-canvas {
            background-color: transparent;
            image-rendering: pixelated;
            cursor: crosshair;
            border: 6px solid #000;
            touch-action: none;
            
            width: 80vw;
            height: 80vw;
            max-width: 420px;
            max-height: 420px;
        }

        /* Bottom Action Panel Tray */
        .toolbar {
            width: 100%;
            max-width: 500px;
            background: rgba(0,0,0,0.6);
            border: 4px solid #000;
            padding: 10px;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .color-preview-wrapper {
            position: relative;
            width: 40px;
            height: 40px;
            border: 3px solid #000;
        }
        #color-picker {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }
        #color-indicator { width: 100%; height: 100%; background: #ff0000; }

        /* Dialog Panels */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal.hidden { display: none !important; }

        .modal-body {
            background: #4a4a4a;
            border: 6px solid #000;
            padding: 20px;
            width: 92%;
            max-width: 380px;
            box-shadow: 0 0 20px #000;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-size: 10px;
            text-align: left;
        }

        #loading-bar-container {
            width: 100%;
            height: 24px;
            background: #555;
            border: 3px solid #000;
            margin-top: 15px;
            padding: 2px;
        }
        #loading-bar-progress {
            width: 0%;
            height: 100%;
            background: #55ff55;
        }

        @media (max-width: 768px) {
            #drawer { width: 100vw; }
            #editor-canvas {
                width: 82vw;
                height: 82vw;
            }
            .mc-btn { font-size: 9px; padding: 8px 10px; }
            .title-fallback-text { font-size: 9px; }
        }
    </style>
</head>
<body>

<div id="drawer" class="closed">
    <div id="drawer-header">
        <h2 style="margin: 0 0 15px 0; font-size: 11px; text-shadow: var(--mc-text-shadow); text-align: center; color: #aaa;">ASSETS BOX</h2>
        <input type="file" id="pack-upload" accept=".zip" style="display: none;">
        <button class="mc-btn" style="width: 100%;" onclick="document.getElementById('pack-upload').click()">
            Load Resource Pack
        </button>
    </div>
    <div id="drawer-content">
        <input type="text" id="texture-search" class="mc-input" placeholder="Search files..." oninput="searchTextures()">
        <div id="texture-grid-target" class="texture-grid"></div>
    </div>
</div>

<div class="mc-trigger">
    <button class="mc-btn" id="drawer-toggle-btn" onclick="toggleDrawer()">
        <span id="open-lbl">MENU</span>
        <span id="close-lbl" style="display: none;">X</span>
    </button>
</div>

<div id="main-workspace">
    <div id="app-header-container">
        <img id="app-title-img" src="title.png" alt="" onerror="handleTitleImageFallback()">
    </div>
    
    <div id="canvas-frame">
        <canvas id="editor-canvas"></canvas>
    </div>

    <div class="toolbar">
        <div class="color-preview-wrapper">
            <div id="color-indicator"></div>
            <input type="color" id="color-picker" value="#ff0000" onchange="updateColor(this.value)">
        </div>
        <button class="mc-btn" id="btn-brush" onclick="setTool('brush')" style="border-color: #fff;">BRUSH</button>
        <button class="mc-btn" id="btn-eraser" onclick="setTool('eraser')">ERASER</button>
        <button class="mc-btn" onclick="openSettingsModal()">⚙</button>
        <button class="mc-btn" onclick="exportPack()" style="background:#55ff55; color:#000; text-shadow:none;">EXPORT</button>
    </div>
</div>

<div id="loading-modal" class="modal hidden">
    <div class="modal-body" style="text-align: center;">
        <h3 style="margin:0; font-size:12px;">Unzipping Assets...</h3>
        <div id="loading-bar-container"><div id="loading-bar-progress"></div></div>
    </div>
</div>

<div id="settings-modal" class="modal hidden">
    <div class="modal-body">
        <h3 style="margin:0 0 20px 0; font-size:12px; text-shadow: var(--mc-text-shadow); text-align: center; color: #ffff55;">FORGE CONFIG</h3>
        
        <div class="setting-row">
            <label>Autosave Cycle (s):</label>
            <input type="number" id="sync-interval-input" class="mc-input" style="width: 80px; margin: 0;" value="30" min="5">
        </div>

        <div class="setting-row">
            <label>Brush Width (px):</label>
            <select id="brush-size-select" class="mc-input" style="width: 80px; margin: 0;">
                <option value="1">1x1</option>
                <option value="2">2x2</option>
                <option value="3">3x3</option>
                <option value="4">4x4</option>
            </select>
        </div>

        <div class="setting-row">
            <label>Display Grid Overlay:</label>
            <input type="checkbox" id="grid-toggle-checkbox" checked onchange="toggleGridLineStyle()">
        </div>

        <div class="setting-row">
            <label>Grid Accent Color:</label>
            <input type="color" id="grid-color-picker" value="#444444" onchange="toggleGridLineStyle()">
        </div>

        <button class="mc-btn" style="width:100%; margin-top: 10px;" onclick="closeSettingsModal()">Apply Config</button>
    </div>
</div>

<script>
    let zipVirtualFileSystem = {}; 
    let currentActivePath = null;
    let selectedTool = 'brush';
    let currentColor = '#ff0000';
    let localAutosaveTimer = null;
    
    let showGridOverlay = true;
    let gridOverlayColor = '#444444';
    let activeBrushSize = 1;

    const canvas = document.getElementById('editor-canvas');
    const ctx = canvas.getContext('2d');
    const drawer = document.getElementById('drawer');

    function handleTitleImageFallback() {
        const container = document.getElementById('app-header-container');
        container.innerHTML = `<span class="title-fallback-text">CRAFTCANVAS STUDIO</span>`;
    }

    function toggleDrawer() {
        const isClosed = drawer.classList.toggle('closed');
        document.getElementById('open-lbl').style.display = isClosed ? 'inline' : 'none';
        document.getElementById('close-lbl').style.display = isClosed ? 'none' : 'inline';
    }

    function openSettingsModal() { document.getElementById('settings-modal').classList.remove('hidden'); }
    function closeSettingsModal() {
        const secs = parseInt(document.getElementById('sync-interval-input').value) || 30;
        clearInterval(localAutosaveTimer);
        localAutosaveTimer = setInterval(commitToAutosave, secs * 1000);
        
        activeBrushSize = parseInt(document.getElementById('brush-size-select').value) || 1;
        document.getElementById('settings-modal').classList.add('hidden');
        if (currentActivePath) reRenderWorkspaceView();
    }

    function toggleGridLineStyle() {
        showGridOverlay = document.getElementById('grid-toggle-checkbox').checked;
        gridOverlayColor = document.getElementById('grid-color-picker').value;
        if (currentActivePath) reRenderWorkspaceView();
    }

    // Process Zip Contents
    document.getElementById('pack-upload').addEventListener('change', async (e) => {
        if (!e.target.files.length) return;
        
        const file = e.target.files[0];
        const loadingModal = document.getElementById('loading-modal');
        const progressFill = document.getElementById('loading-bar-progress');
        
        loadingModal.classList.remove('hidden');
        progressFill.style.width = "15%";

        try {
            const loadedZip = await JSZip.loadAsync(file);
            zipVirtualFileSystem = {};
            
            const totalFiles = Object.keys(loadedZip.files).length;
            let processedFiles = 0;

            for (let path in loadedZip.files) {
                processedFiles++;
                if (!loadedZip.files[path].dir && path.match(/\.(png|jpeg|jpg|webp)$/i)) {
                    const buffer = await loadedZip.files[path].async('arraybuffer');
                    const blob = new Blob([buffer], { type: 'image/png' });
                    
                    const imgUrl = URL.createObjectURL(blob);
                    const sourceImageElement = await imgSetupPromise(imgUrl);
                    
                    const offscreenCanvas = document.createElement('canvas');
                    offscreenCanvas.width = sourceImageElement.width;
                    offscreenCanvas.height = sourceImageElement.height;
                    const oCtx = offscreenCanvas.getContext('2d');
                    oCtx.drawImage(sourceImageElement, 0, 0);

                    zipVirtualFileSystem[path] = {
                        canvas: offscreenCanvas,
                        ctx: oCtx,
                        url: imgUrl,
                        modified: false
                    };
                }
                if (processedFiles % Math.max(1, Math.floor(totalFiles/6)) === 0) {
                    progressFill.style.width = `${Math.min(95, (processedFiles / totalFiles) * 100)}%`;
                }
            }
            
            progressFill.style.width = "100%";
            setTimeout(() => {
                loadingModal.classList.add('hidden');
                rebuildTextureBrowserGrid();
                if (Object.keys(zipVirtualFileSystem).length > 0) {
                    loadTextureToWorkspace(Object.keys(zipVirtualFileSystem)[0]);
                }
            }, 300);

        } catch (err) {
            alert("Error reading file setup: " + err.message);
            loadingModal.classList.add('hidden');
        }
    });

    function imgSetupPromise(src) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = src;
            img.onload = () => resolve(img);
        });
    }

    function rebuildTextureBrowserGrid() {
        const targetGrid = document.getElementById('texture-grid-target');
        targetGrid.innerHTML = '';

        for (let path in zipVirtualFileSystem) {
            const fileData = zipVirtualFileSystem[path];
            const name = path.split('/').pop();
            
            const card = document.createElement('div');
            card.className = `texture-card ${currentActivePath === path ? 'active' : ''}`;
            card.dataset.path = path;
            card.innerHTML = `<img src="${fileData.url}"><span>${name}</span>`;
            card.onclick = () => loadTextureToWorkspace(path);
            targetGrid.appendChild(card);
        }
    }

    function searchTextures() {
        const query = document.getElementById('texture-search').value.toLowerCase();
        document.querySelectorAll('.texture-card').forEach(card => {
            card.style.display = card.dataset.path.toLowerCase().includes(query) ? 'block' : 'none';
        });
    }

    function loadTextureToWorkspace(path) {
        currentActivePath = path;
        document.querySelectorAll('.texture-card').forEach(c => c.classList.remove('active'));
        const activeCard = document.querySelector(`.texture-card[data-path="${path}"]`);
        if (activeCard) activeCard.classList.add('active');

        const fileData = zipVirtualFileSystem[path];
        canvas.width = fileData.canvas.width;
        canvas.height = fileData.canvas.height;
        
        // Lock dynamic aspect ratios directly to CSS properties to resolve scaling deformation
        canvas.style.aspectRatio = `${canvas.width} / ${canvas.height}`;
        
        reRenderWorkspaceView();
    }

    // New High Fidelity Render System — Draws clean symmetry background directly behind textures
    function reRenderWorkspaceView() {
        if (!currentActivePath) return;
        const fileData = zipVirtualFileSystem[currentActivePath];
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;
        
        // 1. Render Perfectly Symmetrical Transparent Checkerboard Pattern Background Blocks
        const tileSize = 1; 
        for (let y = 0; y < canvas.height; y += tileSize) {
            for (let x = 0; x < canvas.width; x += tileSize) {
                ctx.fillStyle = ((x + y) % 2 === 0) ? '#b0b0b0' : '#808080';
                ctx.fillRect(x, y, tileSize, tileSize);
            }
        }

        // 2. Overlay Layer Texture Image Data
        ctx.drawImage(fileData.canvas, 0, 0);

        // 3. Optional Overlay Pixel Isolation Lines
        if (showGridOverlay && canvas.width <= 128) {
            ctx.lineWidth = 0.03;
            ctx.strokeStyle = gridOverlayColor;
            
            for (let i = 0; i <= canvas.width; i++) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j <= canvas.height; j++) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }
        }
    }

    let isDrawing = false;

    // Secure Matrix Coordinates Tracker
    function applyPaintAction(e) {
        if (!currentActivePath) return;

        const rect = canvas.getBoundingClientRect();
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const targetPixelX = Math.floor(((clientX - rect.left) / rect.width) * canvas.width);
        const targetPixelY = Math.floor(((clientY - rect.top) / rect.height) * canvas.height);

        if (targetPixelX >= 0 && targetPixelX < canvas.width && targetPixelY >= 0 && targetPixelY < canvas.height) {
            const fileData = zipVirtualFileSystem[currentActivePath];
            
            if (selectedTool === 'brush') {
                fileData.ctx.fillStyle = currentColor;
                fileData.ctx.fillRect(targetPixelX, targetPixelY, activeBrushSize, activeBrushSize);
            } else if (selectedTool === 'eraser') {
                fileData.ctx.clearRect(targetPixelX, targetPixelY, activeBrushSize, activeBrushSize);
            }
            
            fileData.modified = true;
            reRenderWorkspaceView();
        }
    }

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; applyPaintAction(e); });
    canvas.addEventListener('mousemove', (e) => { if (isDrawing) applyPaintAction(e); });
    window.addEventListener('mouseup', () => { if(isDrawing) { isDrawing = false; syncThumbnailPreview(); } });

    canvas.addEventListener('touchstart', (e) => { isDrawing = true; applyPaintAction(e); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { if (isDrawing) { e.preventDefault(); applyPaintAction(e); } }, {passive: false});
    window.addEventListener('touchend', () => { if(isDrawing) { isDrawing = false; syncThumbnailPreview(); } });

    function setTool(tool) {
        selectedTool = tool;
        document.getElementById('btn-brush').style.borderColor = tool === 'brush' ? '#fff' : '#000';
        document.getElementById('btn-eraser').style.borderColor = tool === 'eraser' ? '#fff' : '#000';
    }

    function updateColor(hex) {
        currentColor = hex;
        document.getElementById('color-indicator').style.background = hex;
    }

    function syncThumbnailPreview() {
        if (!currentActivePath) return;
        const fileData = zipVirtualFileSystem[currentActivePath];
        
        fileData.canvas.toBlob((blob) => {
            if (!blob) return;
            const newUrl = URL.createObjectURL(blob);
            fileData.url = newUrl;
            
            const cardImg = document.querySelector(`.texture-card[data-path="${currentActivePath}"] img`);
            if (cardImg) cardImg.src = newUrl;
        }, 'image/png');
    }

    function commitToAutosave() {
        if (!currentActivePath) return;
        const fileData = zipVirtualFileSystem[currentActivePath];
        
        fileData.canvas.toBlob((blob) => {
            if (!blob) return;
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
                localStorage.setItem(`cc_save_file:${currentActivePath}`, reader.result);
            };
        }, 'image/png');
    }

    async function exportPack() {
        if (Object.keys(zipVirtualFileSystem).length === 0) {
            alert("No pack textures loaded.");
            return;
        }

        const outputZipGenerator = new JSZip();
        for (let path in zipVirtualFileSystem) {
            const fileData = zipVirtualFileSystem[path];
            const blobData = await new Promise(resolve => fileData.canvas.toBlob(resolve, 'image/png'));
            outputZipGenerator.file(path, blobData);
        }

        const generatedArchiveBlob = await outputZipGenerator.generateAsync({type : "blob"});
        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = URL.createObjectURL(generatedArchiveBlob);
        downloadAnchor.download = "forge_resource_pack.zip";
        downloadAnchor.click();
    }

    localAutosaveTimer = setInterval(commitToAutosave, 30000);
</script>
</body>
</html>
